plugins {
	id 'java-library'
}

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {
	implementation 'org.json:json:20230618'
}

jar {
	from {
		configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
	}
	if (gitUsed()) {
		file("../app_pojavlauncher/src/main/assets/components/forge_installer/version").write(getGitHash(project.projectDir))
	}
	manifest {
		attributes(
			"Manifest-Version": "1.0",
			"PreMain-Class": "git.artdeell.installer_agent.Agent"
		)
	}
	destinationDirectory.set(file("../app_pojavlauncher/src/main/assets/components/forge_installer/"))
}
